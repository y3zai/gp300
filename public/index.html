<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GP 300: Geopolitics Uncertainty Index Archive</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"
    integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK"
    crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
      --blue-dim: rgba(88, 166, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 24px 0;
    }

    .header-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .archive-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .header-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-change {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
    }

    .change {
      font-size: 18px;
      font-weight: 600;
    }

    .change.positive {
      color: var(--green);
    }

    .change.negative {
      color: var(--red);
    }

    .timestamp {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Chart Section */
    #chart-section {
      border-bottom: 1px solid var(--border);
      padding: 16px 0 24px;
    }

    .period-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .period-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .period-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .period-btn.active {
      background: var(--blue-dim);
      border-color: var(--blue);
      color: var(--blue);
    }

    #chart-container {
      width: 100%;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Footer */
    footer {
      padding: 16px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
    }

    /* Loading */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--text-muted);
      font-size: 14px;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    .loading-overlay span {
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #chart-container {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <div class="header-inner">
        <p class="archive-label">Historical archive</p>
        <h1 class="header-title">GP 300: Geopolitics Uncertainty Index</h1>
        <div class="header-value" id="index-value">—</div>
        <div class="header-change">
          <span class="change" id="index-change"></span>
          <time class="timestamp" id="index-timestamp"></time>
        </div>
      </div>
    </header>

    <section id="chart-section">
      <div class="period-selector" id="period-selector" role="group" aria-label="Chart range">
        <button class="period-btn" data-range="1D" aria-pressed="false">1D</button>
        <button class="period-btn" data-range="1W" aria-pressed="false">1W</button>
        <button class="period-btn" data-range="1M" aria-pressed="false">1M</button>
        <button class="period-btn" data-range="3M" aria-pressed="false">3M</button>
        <button class="period-btn" data-range="YTD" aria-pressed="false">YTD</button>
        <button class="period-btn" data-range="1Y" aria-pressed="false">1Y</button>
        <button class="period-btn" data-range="5Y" aria-pressed="false">5Y</button>
        <button class="period-btn active" data-range="MAX" aria-pressed="true">MAX</button>
      </div>
      <div id="chart-container">
        <div class="loading-overlay" id="chart-loading"><span>Loading chart data...</span></div>
      </div>
    </section>

    <footer>
      CLI: <a href="https://github.com/y3zai/gp300/blob/main/CLI_README.md" target="_blank" rel="noopener">Usage instructions</a> &middot;
      Source Code at <a href="https://github.com/y3zai/gp300" target="_blank" rel="noopener">GitHub</a> &middot;
      Data from <a href="https://polymarket.com" target="_blank" rel="noopener">Polymarket</a> &middot;
      <a href="/history.json" download>Download history (JSON)</a>
    </footer>
  </div>

  <script>
    let historyData = [];
    let finalObservation;
    let chart = null;
    let areaSeries = null;

    function formatNumber(n) {
      return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getRangeCutoff(range) {
      const end = new Date(finalObservation.time);
      const year = end.getUTCFullYear();
      const month = end.getUTCMonth();
      const day = end.getUTCDate();
      switch (range) {
        case '1D': return end.getTime() - 86400000;
        case '1W': return end.getTime() - 7 * 86400000;
        case '1M': return Date.UTC(year, month - 1, day);
        case '3M': return Date.UTC(year, month - 3, day);
        case 'YTD': return Date.UTC(year, 0, 1);
        case '1Y': return Date.UTC(year - 1, month, day);
        case '5Y': return Date.UTC(year - 5, month, day);
        default: return -Infinity;
      }
    }

    // --- Chart ---
    function initChart() {
      const container = document.getElementById('chart-container');
      document.getElementById('chart-loading').remove();

      chart = LightweightCharts.createChart(container, {
        layout: {
          background: { type: 'solid', color: '#0d1117' },
          textColor: '#8b949e',
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif",
        },
        grid: {
          vertLines: { color: '#21262d' },
          horzLines: { color: '#21262d' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
        },
        rightPriceScale: {
          borderColor: '#30363d',
        },
        timeScale: {
          borderColor: '#30363d',
          timeVisible: true,
          secondsVisible: false,
          // The default 0.5px floor clips dense histories even after fitContent().
          minBarSpacing: 0.001,
          lockVisibleTimeRangeOnResize: true,
        },
        handleScroll: { vertTouchDrag: false },
      });

      areaSeries = chart.addAreaSeries({
        topColor: 'rgba(88, 166, 255, 0.4)',
        bottomColor: 'rgba(88, 166, 255, 0.0)',
        lineColor: '#58a6ff',
        lineWidth: 2,
      });

      // Responsive resize
      const ro = new ResizeObserver(() => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
      ro.observe(container);
    }

    function getDownsampleInterval(count) {
      if (count <= 2500) return 0;
      if (count <= 12000) return 1800;
      return 3600;
    }

    // Keep the last observation in each bucket, using its actual timestamp.
    function chartPoints(data) {
      const interval = getDownsampleInterval(data.length);
      const buckets = new Map();
      for (const { time, value } of data) {
        const seconds = Math.floor(time / 1000);
        const key = interval ? Math.floor(seconds / interval) : seconds;
        buckets.set(key, { time: seconds, value });
      }
      const points = Array.from(buckets.values());
      const first = Math.floor(data[0].time / 1000);
      if (first !== points[0].time) {
        points.unshift({ time: first, value: data[0].value });
      }
      return points;
    }

    function findRebaseTimestamps() {
      // Detect jumps back near the configured base (1000) from below 900.
      const rebases = [];
      for (let i = 1; i < historyData.length; i++) {
        const prev = historyData[i - 1].value;
        const { time, value } = historyData[i];
        if (prev <= 900 && value > prev && Math.abs(value - 1000) <= 25) {
          rebases.push(Math.floor(time / 1000));
        }
      }
      return rebases;
    }

    function renderRange(range) {
      const cutoff = getRangeCutoff(range);
      const filtered = historyData.filter(d => d.time >= cutoff);
      const sampled = chartPoints(filtered);
      areaSeries.setData(sampled);

      const markers = findRebaseTimestamps()
        .filter(time => time >= sampled[0].time && time <= sampled.at(-1).time)
        .map(time => ({ time, position: 'aboveBar', color: '#f0883e', shape: 'arrowDown', text: 'Rebase' }));
      areaSeries.setMarkers(markers);
      requestAnimationFrame(() => chart.timeScale().fitContent());

      const startValue = filtered[0].value;
      const change = finalObservation.value - startValue;
      const percent = startValue === 0 ? 0 : change / startValue * 100;
      const sign = change >= 0 ? '+' : '';
      const changeEl = document.getElementById('index-change');
      changeEl.textContent = `${sign}${formatNumber(change)} (${sign}${percent.toFixed(2)}%)`;
      changeEl.className = 'change ' + (change >= 0 ? 'positive' : 'negative');
    }

    function renderFinalObservation() {
      document.getElementById('index-value').textContent = formatNumber(finalObservation.value);
      const timestamp = document.getElementById('index-timestamp');
      const date = new Date(finalObservation.time);
      timestamp.dateTime = finalObservation.timestamp;
      timestamp.textContent = 'Final observation · ' + date.toLocaleString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', timeZoneName: 'short',
      });
    }

    document.getElementById('period-selector').addEventListener('click', e => {
      if (!areaSeries || !e.target.classList.contains('period-btn')) return;
      document.querySelectorAll('.period-btn').forEach(button => {
        const active = button === e.target;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      renderRange(e.target.dataset.range);
    });

    async function init() {
      try {
        const response = await fetch('/history.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const observations = await response.json();
        historyData = observations.map(({ timestamp, value }) => ({ timestamp, value, time: Date.parse(timestamp) }));
        finalObservation = historyData.at(-1);
        if (!finalObservation || !Number.isFinite(finalObservation.time) || !Number.isFinite(finalObservation.value)) {
          throw new Error('Missing final observation');
        }
      } catch {
        document.getElementById('chart-loading').querySelector('span').textContent = 'Could not load the history archive';
        return;
      }

      initChart();
      renderFinalObservation();
      renderRange('MAX');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>

</html>
