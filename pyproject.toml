[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gp300"
version = "0.1.0"
description = "CLI for the GP 300 Geopolitics Uncertainty Index"
readme = "CLI_README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yu Zheng" },
]
keywords = ["geopolitics", "prediction-markets", "polymarket", "index", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://gp300.y3z.ai"

[project.scripts]
gp300 = "cli.main:cli"

[tool.hatch.build.targets.sdist]
include = ["cli/", "CLI_README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["cli"]
