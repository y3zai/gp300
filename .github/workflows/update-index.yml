name: Update GP300 index
run-name: GP300 ${{ inputs.scheduled_at }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Scheduled UTC slot in ISO 8601 format
        required: true
        type: string
      dry_run:
        description: Calculate without publishing
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gp300-index-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install runner dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/gp300"
          "$RUNNER_TEMP/gp300/bin/python" -m pip install -r requirements.txt
      - name: Calculate and publish the index
        env:
          CLOUDFLARE_ACCOUNT_ID: 74bdaef09e34deb7fa20ab321951dca5
          CLOUDFLARE_D1_DATABASE_ID: 8cf94e95-0310-4a7a-98b6-0430c799c27d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GP300_SCHEDULER_TOKEN }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--scheduled-at "$SCHEDULED_AT")
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          "$RUNNER_TEMP/gp300/bin/python" -m src.update_index "${args[@]}"
