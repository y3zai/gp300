name: Rebalance index weights

on:
  workflow_dispatch:

concurrency:
  group: gp300-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          DOM=$(date -u +%-d)
          if [ "$DOM" -eq 1 ] || [ "$DOM" -eq 15 ]; then
            echo "Skipping: reconstitute is scheduled today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  run:
    needs: check
    if: needs.check.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py --rebalance -v
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Rebalance index weights"
          git push
